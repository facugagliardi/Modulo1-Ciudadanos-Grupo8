name: Testing G3

on:
  push:
    branches: ['**']
    tags: [v1.0-testing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  backend:
    name: Java - tests, cobertura, PIT y PMD
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      M1_TEST_RABBIT_PORT: '55679'
    services:
      rabbitmq:
        image: rabbitmq:4.3-management@sha256:1cc652597e8d31d2bb4afc3be60f84961fe17aa4edc5bf067cbf9834afcc441b
        ports:
          - 55679:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: PostgreSQL aislado para integracion
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          echo "M1_TEST_POSTGRES_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo 'M1_TEST_POSTGRES_USER=postgres' >> "$GITHUB_ENV"
          echo 'M1_TEST_POSTGRES_URL=jdbc:postgresql://127.0.0.1:55440/postgres' >> "$GITHUB_ENV"
          docker build -f docker/testing/postgres.Dockerfile -t ciudadanos-postgres-ci docker/testing
          docker run -d --name ci-postgres -e POSTGRES_PASSWORD="$db_password" \
            -p 127.0.0.1:55440:5432 \
            --health-cmd='pg_isready -U postgres -h 127.0.0.1' --health-interval=2s --health-retries=30 \
            ciudadanos-postgres-ci
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' ci-postgres)" = healthy ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Compilar, ejecutar tests y gates de cobertura, PIT y PMD
        run: bash ./mvnw -B -ntp verify
      - name: Verificar alcance no vacio y minimos del dominio
        run: python3 scripts/medir-dominio.py --exigir
      - name: Comprobar que no se omitieron tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('target/surefire-reports').glob('TEST-*.xml'))
          assert reports, 'Faltan reportes Surefire'
          counts = {key: sum(int(ET.parse(p).getroot().get(key, 0)) for p in reports)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          print(counts)
          assert counts['tests'] > 0 and not any(counts[k] for k in ('failures', 'errors', 'skipped')), counts
          PY
      - name: Inventario Java resuelto, incluidos tests
        run: bash ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DincludeTestScope=true -DoutputFormat=json -DoutputName=bom-sca
      - name: Instalar scanner verificado
        run: bash scripts/instalar-trivy.sh
      - name: SCA Java y revision acotada de aplicabilidad
        run: python3 scripts/auditar-dependencias.py --sbom target/bom-sca.json --report-dir target/sca
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-reportes
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/pmd.xml
            target/site/pmd.html
            target/pit-reports/
            target/dominio-cobertura.json
            target/bom-sca.json
            target/sca/
          retention-days: 14

  frontend:
    name: React - lint, tests, cobertura y build
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      TZ: America/Argentina/Buenos_Aires
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=coverage/junit.xml
      - name: Exigir tests ejecutados sin omisiones
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('coverage/junit.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          counts = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          print(counts)
          assert counts['tests'] > 0 and not any(counts[k] for k in ('failures', 'errors', 'skipped')), counts
          PY
      - name: Rechazar dependencias con alertas altas o criticas
        run: npm audit --audit-level=high --json > coverage/dependencias.json
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-reportes
          path: frontend/coverage/
          retention-days: 14

  compose:
    name: Sistema completo - Compose y persistencia
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build y arranque desde cero
        run: docker compose up --build -d --wait --wait-timeout 720
      - name: Login, permisos, proxy y consumidor real
        run: docker compose run --rm -T verificar
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Instalar y auditar Playwright
        working-directory: e2e
        run: |
          npm ci --ignore-scripts
          mkdir -p ../reportes/e2e
          npm audit --audit-level=high --json > ../reportes/e2e/dependencias.json
          npx playwright install --with-deps chromium
      - name: Cinco recorridos E2E con navegador y servicios reales
        working-directory: e2e
        env:
          E2E_REPORT_DIR: ${{ github.workspace }}/reportes/e2e
          E2E_SOURCE_REF: ${{ github.sha }}
        run: npm test
      - name: Recrear contenedores conservando volumenes
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 180
          docker compose run --rm -T -e EXIGIR_PERSISTENCIA=true verificar
      - name: Construir etapas de compilacion para auditarlas
        run: |
          docker build --target build -t ciudadanos-testing-backend-build .
          docker build --target build -t ciudadanos-testing-frontend-build ./frontend
      - name: Instalar scanner verificado
        run: bash scripts/instalar-trivy.sh
      - name: SCA de imagenes de ejecucion y compilacion
        run: |
          python3 scripts/auditar-dependencias.py --report-dir reportes/sca \
            --imagen backend=ciudadanos-testing-backend:latest \
            --imagen frontend=ciudadanos-testing-frontend:latest \
            --imagen node=ciudadanos-testing-node:latest \
            --imagen postgres=ciudadanos-testing-postgres:latest \
            --imagen rabbitmq=rabbitmq:4.3-management@sha256:1cc652597e8d31d2bb4afc3be60f84961fe17aa4edc5bf067cbf9834afcc441b \
            --imagen maven-build=ciudadanos-testing-backend-build:latest \
            --imagen node-build=ciudadanos-testing-frontend-build:latest
      - name: Guardar evidencia tecnica
        if: always()
        run: |
          mkdir -p reportes
          docker compose ps --all > reportes/servicios.txt
          docker compose logs --no-color > reportes/compose.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compose-reportes
          path: reportes/
          retention-days: 14
      - name: Limpiar recursos efimeros del runner
        if: always()
        run: docker compose down -v

  secretos:
    name: Secretos - archivos e historial
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar Gitleaks verificando checksum
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Escanear sin excluir los archivos Bruno
        shell: pwsh
        run: ./scripts/auditar-secretos.ps1 -Gitleaks "$env:RUNNER_TEMP/gitleaks" -ReportDir "$env:RUNNER_TEMP/secret-audit"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: secretos-reportes-redactados
          path: |
            ${{ runner.temp }}/secret-audit/*.json
            ${{ runner.temp }}/secret-audit/*.log
          retention-days: 14

  resultado:
    name: Resultado G3
    if: always()
    needs: [backend, frontend, compose, secretos]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref_type == 'tag'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: El tag de testing debe apuntar a un commit integrado en main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Exigir todas las etapas aprobadas
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTADOS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('| Etapa | Resultado |\n|---|---|\n')
              for name, value in results.items():
                  summary.write(f"| {name} | {value['result']} |\n")
          assert all(v['result'] == 'success' for v in results.values()), results
          PY
