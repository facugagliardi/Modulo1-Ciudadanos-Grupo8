spring:
  config:
    import: optional:file:./application-local.yml

  application:
    name: ciudadanos-modulo1

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ciudadanos_m1}
    username: ${POSTGRES_USER:ciudadanos_app}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # El esquema lo crea db/01_schema.sql. "validate" hace que el arranque
    # falle si las entidades y las tablas se desincronizan, en vez de romper en runtime.
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    deserialization:
      # Los DTO son la lista blanca de campos aceptados: cualquier propiedad que
      # no este declarada hace fallar el request con 400, en vez de ignorarse en
      # silencio y dejar creer que el dato se guardo.
      fail-on-unknown-properties: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB


  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
      validate-server-certificate: true
      verify-hostname: true
    listener:
      simple:
        auto-startup: ${RABBITMQ_AUTO_STARTUP:false}
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  events:
    exchange: ${APP_EVENTS_EXCHANGE:muni.inbox}
    queue: ${APP_EVENTS_QUEUE:q.ciudadanos}
    source-module: ${APP_EVENTS_SOURCE_MODULE:ciudadanos}
  # Donde se guardan los archivos de POST /personas/{id}/documentos.
  almacenamiento:
    directorio: ${ALMACENAMIENTO_DIR:./archivos-documentos}

  jwt:
    # HS256 exige >= 32 bytes. Generar con: openssl rand -base64 48
    # Definir APP_JWT_SECRET o usar el archivo local ignorado por Git.
    secret: ${APP_JWT_SECRET}
    issuer: modulo1-ciudadanos
    access-token-ttl-seconds: 900      # 15 min
    refresh-token-ttl-seconds: 604800  # 7 dias

logging:
  level:
    ar.edu.uade.ciudadanos: DEBUG
